# The strict config: AI-writing tells, for posts that are new or still drafts. `.vale.ini` stays
# the lenient config for the archive (and for spelling and typos on every file); this one only
# looks for the habits of agent-written prose, so run both on a draft (CLAUDE.md, "Prose
# linting"). CI fails a pull request that adds a post, or edits a draft, with any alert here.
#
#   vale --config=.github/vale/new-posts.ini content/posts/my-new-post.md
#
# Run from the repository root; StylesPath is relative to this file. A deliberate use of a
# flagged phrase: wrap it in <!-- vale Repo.AITellsX = NO --> ... <!-- vale Repo.AITellsX = YES -->.
#
# Every rule here was measured against five agent-written drafts (the agent-loop series,
# 6,783 words) and the blog's own pre-AI posts (2013-2023 plus homelab-dns-configuration,
# 31 posts, 14,201 words). Alerts per 1,000 words, drafts / human baseline:
#   Repo.AITellsBoldLeadIn    4.42 / 0      "**Run records.** Every run ..."
#   Repo.AITellsFragment      2.95 / 0.07   "Fixed." "Fine." "No code yet."
#   Repo.AITellsStockPhrase   1.92 / 0      "says it plainly", "in miniature", "None of this is"
#   Repo.AITellsThatsThe      1.77 / 0      "That's the whole loop in miniature."
#   Repo.AITellsDramaticSo    1.62 / 0.07   "So the question became ..."
#   Repo.AITellsSetUp         1.47 / 0      "The second half matters more." "The funny part is"
#   Repo.AITellsColonReveal   1.18 / 0      "The verdict: ..." "The fix: ..."
#   Repo.AITellsWhichTail     0.88 / 0      ", which is rather the point." "Which left ..."
#   Repo.AITellsNotY          0.74 / 0      "..., not output." "isn't the pools, it's ..."
#   Repo.AITellsRatherThan    0.74 / 0.07   "a loop rather than a pile of advice"
#   Repo.AITellsQuietly       0.59 / 0      "quietly", "silently"
#   Repo.AITellsSignpost      0.59 / 0      "Here's the honest version."
#   Repo.AITellsHonest        0.29 / 0      "the honest answer"
#   Repo.AITellsTurnsOut      0.29 / 0      "turned out to be"
#   all of the above         19.46 / 0.21   (132 alerts on the drafts, 3 on the baseline)
# The package rules below had no hits on either set: they catch blunter machine prose.
# Measured and left out because the blog's own voice trips them as often or more:
#   Voices.ColonReveal 1.18 / 0.56 ("One last note: ...", "The problem: ..."; narrowed into
#   Repo.AITellsColonReveal), Voices.BinaryContrast 0.15 / 0.14 ("it's not that unique, but";
#   narrowed into Repo.AITellsNotY), Human.Tics 0.15 / 0.35 ("crucial", "deep dive"),
#   Human.Dashes 0 / 0.14 (the blog writes " - ", which no rule should flag: 1.33 / 4.15),
#   Voices.InflatedWords 0 / 0.28, Voices.WeakVerbs 0 / 0.35, Claude.Modifiers 0 / 0.14,
#   Voices.SuperficialAnalysis 0 / 0.07, sentence-initial "And" 0.74 / 1.06, "exactly"
#   0.88 / 0.49, paragraphs of 12 words or fewer 0.74 / 0.99, "in other words" 0 / 0.07.
StylesPath = styles
MinAlertLevel = suggestion
IgnoredScopes = code, tt, frontmatter

[*.md]
# Hugo shortcodes are markup, not prose (as in .vale.ini).
TokenIgnores = (\{\{[<%][^\n]*?[%>]\}\})
# Repo: the AI-tell rules (Repo/AITells*.yml), all warnings. SentenceLength is for CLAUDE.md.
BasedOnStyles = Repo
Repo.SentenceLength = NO
# A chat opener ("Great question!", "As an AI") in a post is never deliberate: the one error.
Human.Openers = error
# Chat sign-offs ("I hope this helps", "Feel free to", "In summary,").
Human.Closers = warning
# "Here's the thing", "I'll be honest", "let me be clear".
Voices.ThroatClearing = warning
# "In conclusion", "Ultimately", "Overall" opening a line.
Voices.Recap = warning
# "stands as a testament", "plays a vital role", "excited to announce".
Voices.Puffery = warning
# "experts agree", "studies show".
Voices.Weasel = warning
# "delve", "tapestry", "harness", "game-changer".
Voices.Banned = warning
# "it's worth noting", "it's important to note", "one could argue".
Direct.Hedging = warning
