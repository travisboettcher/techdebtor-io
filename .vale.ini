proselint.DateDecades = warning
proselint.DateDecadesFull = warning
proselint.DateMidnight = warning
proselint.DateMonthComma = warning
proselint.DateMonthOf = warning
proselint.DateRedundancy = warning
proselint.DateSpacing = warning
proselint.EponymousAdjectives = warning
proselint.EtAl = warning
proselint.EtAlNested = warning
proselint.FalsePlurals = warning
proselint.GenderBias = warning
proselint.GenderBiasForms = warning
proselint.InferiorSuperior = warning
