# Model-facing text: the agent instructions in CLAUDE.md.
[CLAUDE.md]
BasedOnStyles = Vale, Voices, Repo, Prompts
Vale.Repetition = error
# Full of command names, paths and template names; the blog's vocabulary is for posts.
Vale.Spelling = NO
Vale.Terms = NO
# "Content: each post is ..." definition lists are the file's layout, not a rhetorical reveal.
Voices.ColonReveal = NO
# Hedges in an instruction ("you may want to", "it's worth noting"); the rest of Direct (25-word
# sentences, a reading-ease floor) is a voice for chat replies, not for a contract.
Direct.Hedging = warning
# A per-file cap on "never" and "always" pushes toward weakening real rules.
Prompts.Absolutes = NO
