# "from 5×5 to 13×13" reads to it as a date range.
proselint.DateRange = suggestion

# Warnings: usually a real slip (a misspelling, a wrong form, a leftover TODO, a loaded word).
proselint.Annotations = warning
proselint.BackFormations = warning
proselint.Capitalization = warning
proselint.CapitalizationDays = warning
proselint.CapitalizationMonths = warning
proselint.CapitalizationSeasons = warning
proselint.Copyright = warning
proselint.Currency = warning
