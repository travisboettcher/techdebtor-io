# Prose linting with Vale 3.28.1 (pinned in .github/workflows/prose.yml). Run from the repository
# root with relative paths: the section globs below pick each file's rules by its path.
# CLAUDE.md ("Prose linting") says how to install the packages, run Vale, add vocabulary and turn a
# rule off.
#
# StylesPath holds the upstream packages, unmodified, installed by .github/scripts/vale_packages.py
# from the versioned release zips and sha256 pins in .github/vale/packages.json (never `vale sync`;
# never a `latest` URL). They are gitignored. Tracked here: Repo/ and config/vocabularies/Repo/.
# - proselint and the core of Voices: on posts, pages and READMEs, tuned below for a casual,
#   first-person blog: what is plainly wrong is a warning (or an error, for repeated words); taste is
#   a suggestion; rules that fight the voice are off.
# - Prompts: rules for instruction files, on CLAUDE.md only.
# - Std: not enabled; Repo.SentenceLength extends one of its rules.
# - Repo: this repository's own rule for model-facing text (SentenceLength);
#   config/vocabularies/Repo/accept.txt: terms Vale.Spelling accepts.
# Turn a rule off with `Package.Rule = NO`, or change its level with `= warning`, in the section for
# the files it misfires on, with a one-line comment saying why.
StylesPath = .github/vale/styles
# Everything, suggestions included, when you run Vale yourself; CI picks its own level per file
# (prose.yml).
MinAlertLevel = suggestion
Vocab = Repo
# Never lint code spans, fenced code or YAML front matter.
IgnoredScopes = code, tt, frontmatter

# Hugo shortcodes ({{< xword rows="c/u/c" ... >}}, {{% ... %}}) are markup, not prose: their
# arguments read as misspellings and their "???????" grid rows as hyperbole. One shortcode per match,
# never across a line.
[*.md]
TokenIgnores = (\{\{[<%][^\n]*?[%>]\}\})

# Posts, pages and the human-facing READMEs.
[{content/**/*.md,README.md,scripts/**/README.md}]
BasedOnStyles = Vale, Voices, proselint

# Vale core. A repeated word is always a mistake, so it is the one error.
Vale.Repetition = error
# Every new post brings new names (places, people, tools): add them to the vocabulary rather than
# failing the build on them.
Vale.Spelling = warning
Vale.Terms = warning

# Voices core: written to catch machine-written filler, so it is tuned down for a person's own voice.
# A rhetorical "it's not X, it's Y" and a "Here's the thing" aside are how this blog talks.
Voices.BinaryContrast = suggestion
Voices.ThroatClearing = suggestion
Voices.WeakVerbs = suggestion
Voices.SuperficialAnalysis = suggestion
# Inflated or puffed-up words and recap endings are worth a second look, never a failure.
Voices.Banned = warning
Voices.InflatedWords = warning
Voices.Puffery = warning
Voices.Recap = warning
Voices.Weasel = warning
# "Next up: the build" and "One last note: it ..." are the blog's conversational set-ups.
Voices.ColonReveal = NO

# proselint: every rule ships as an error, so each one is set here.
# Off: rules that fight a casual first-person voice or misfire on Markdown source.
# Markdown source and the WordPress-era archive mix straight and curly quotes; both render fine.
proselint.CurlyQuotes = NO
# `...` is fine in Markdown source; Hugo's typographer renders it.
proselint.Ellipsis = NO
# "resume" and other plain spellings are fine without accents.
proselint.Diacritical = NO
# Exclamation marks are part of the voice ("Chicken Burritos!", "Japan Trip!!").
proselint.Exclamation = NO
# Opening a paragraph with "But" is ordinary conversational English.
proselint.But = NO
# "Hopefully" as a sentence adverb is ordinary English; the rule is prescriptivist taste.
proselint.Skunked = NO
# Duplicates Vale.Repetition, which reports the same repeated word as an error.
proselint.LexicalIllusions = NO
# "2x faster" and "5x5" are normal in technical posts; posts use × where it matters.
proselint.Multiplication = NO
# Reads the raw file (front matter too), and HTML collapses the spaces anyway.
proselint.SentenceSpacing = NO
# Same as SentenceSpacing: raw-file read, invisible once rendered.
proselint.SentenceSpacingMixed = NO

# Suggestions: taste, not mistakes. Shown when you run Vale on a post; never annotated in CI.
proselint.Very = suggestion
proselint.Chatspeak = suggestion
proselint.ChatspeakNested = suggestion
proselint.Hyperbole = suggestion
proselint.Cliches = suggestion
proselint.ClichesDiction = suggestion
proselint.ClichesGarner = suggestion
proselint.ClichesHell = suggestion
proselint.ClichesNested = suggestion
proselint.Greylist = suggestion
proselint.Hedging = suggestion
proselint.CorporateSpeak = suggestion
proselint.Jargon = suggestion
proselint.Commercialese = suggestion
proselint.CommercialeseNested = suggestion
proselint.Bureaucratese = suggestion
proselint.Airlinese = suggestion
proselint.Pretension = suggestion
proselint.Debased = suggestion
proselint.Narcissism = suggestion
proselint.Metadiscourse = suggestion
proselint.Apologizing = suggestion
proselint.Suddenly = suggestion
proselint.Archaisms = suggestion
proselint.Latin = suggestion
proselint.Needless = suggestion
proselint.Redundancy = suggestion
proselint.RedundancyGarner = suggestion
proselint.RedundancyGarnerPatterns = suggestion
proselint.RedundancyNested = suggestion
proselint.RedundancyNordquist = suggestion
proselint.RedundancyWallace = suggestion
