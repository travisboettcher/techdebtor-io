proselint.PreferredFormsMeantimeInner = suggestion
proselint.Composition = suggestion
proselint.CompositionNested = suggestion
proselint.CompositionPatterns = suggestion
proselint.ScareQuotes = suggestion
proselint.Uncomparables = suggestion
proselint.UncomparablesMost = suggestion
proselint.TensePresent = suggestion
proselint.Oxymorons = suggestion
proselint.Illogic = suggestion
proselint.IllogicCoin = suggestion
proselint.IllogicCollusion = suggestion
proselint.MentalTelepathy = suggestion
proselint.MixedMetaphors = suggestion
proselint.MixedMetaphorsBottleneck = suggestion
proselint.GroupTerms = suggestion
proselint.AnimalLabels = suggestion
proselint.DenizenLabels = suggestion
