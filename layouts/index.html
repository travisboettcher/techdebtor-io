{{ define "main" }}
<section class="post-list">
  {{ $posts := where .Site.RegularPages "Section" "posts" }}
  {{ range $posts }}
    {{ $post := . }}
    <article class="post-card">
      {{ with .Params.hero_image }}
        <a class="post-card-image-link" href="{{ $post.RelPermalink }}">
          <img class="post-card-image" src="{{ . }}" alt="{{ $post.Title }}" loading="lazy">
        </a>
      {{ end }}
      <div class="post-card-content">
        <h2><a class="post-title-link" href="{{ $post.RelPermalink }}">{{ $post.Title }}</a></h2>
        <p class="post-meta">
          <time datetime="{{ $post.Date.Format "2006-01-02" }}">{{ $post.Date.Format "January 2, 2006" }}</time>
          <span>{{ $post.ReadingTime }} min read</span>
        </p>
      </div>
    </article>
  {{ end }}
</section>
{{ end }}
