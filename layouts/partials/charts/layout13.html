<figcaption>Same information, half the bytes. A state has one column per square across (plus a few flags), and each column stores its unfinished down word's length, trailing unchecked letters, and balance (checked minus unchecked), plus which group of connected white squares it belongs to. Those summaries only ever take fewer than 32 different values, so they fit in a 5-bit code, and a row has at most 8 separate groups of white squares, so 3 bits name the group. The count shrinks from 128 bits to 64, still far more than the biggest count stored.</figcaption>
